<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subtext Playground</title>

<link rel="stylesheet" href="vendor/codemirror/codemirror.css">
<script src="vendor/codemirror/codemirror.js"></script>
<script src="vendor/codemirror/matchbrackets.js"></script>
<script src="vendor/codemirror/active-line.js"></script>
<script src="vendor/codemirror/comment.js"></script>
<script src="vendor/codemirror/placeholder.js"></script>
<script src="subtext-mode.js"></script>

<style>
:root {
    --bg:        #161a22;
    --panel:     #1b212c;
    --editor-bg: #191f29;
    --line:      #2a3140;
    --ink:       #e6e4dc;
    --muted:     #828b9c;
    --faint:     #5d6575;
    --arrow:     #e8b64c;   /* the => operator, run button, accents      */
    --mint:      #9ece8f;   /* defined function names                    */
    --sky:       #86b3e3;   /* function calls                            */
    --lilac:     #c9a3dd;   /* register calls                            */
    --rose:      #d9a09b;   /* regex patterns                            */
    --err:       #e07a7a;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Code",
            Menlo, Consolas, "DejaVu Sans Mono", monospace;
    --serif: "Charter", "Bitstream Charter", "Source Serif Pro",
             Cambria, Georgia, serif;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    display: flex;
    flex-direction: column;
}

/* ---------- header ---------- */

header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--line);
}

header h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: 26px;
    letter-spacing: 0.01em;
}

header .tagline {
    color: var(--muted);
    font-size: 12.5px;
}

header nav {
    margin-left: auto;
    display: flex;
    gap: 18px;
    font-size: 12.5px;
}

header nav a {
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
}

header nav a:hover, header nav a:focus-visible {
    color: var(--ink);
    border-bottom-color: var(--arrow);
}

/* ---------- toolbar ---------- */

.toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 24px;
}

.toolbar .label {
    color: var(--faint);
    font-size: 12px;
    margin-right: 2px;
}

.chip {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    cursor: pointer;
}

.chip:hover, .chip:focus-visible {
    color: var(--ink);
    border-color: var(--muted);
}

.toolbar .spacer { flex: 1; }

button.action {
    font-family: var(--mono);
    font-size: 13px;
    border-radius: 6px;
    padding: 6px 16px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
}

button.action:hover:not(:disabled), button.action:focus-visible {
    border-color: var(--muted);
}

button.action:disabled {
    color: var(--faint);
    cursor: default;
}

#run-btn {
    background: var(--arrow);
    border-color: var(--arrow);
    color: #1c1708;
    font-weight: 700;
}

#run-btn:hover:not(:disabled), #run-btn:focus-visible {
    filter: brightness(1.08);
}

#run-btn:disabled {
    background: var(--line);
    border-color: var(--line);
    color: var(--faint);
}

#run-btn kbd {
    font-family: inherit;
    font-weight: 400;
    font-size: 11px;
    opacity: 0.75;
    margin-left: 6px;
}

/* ---------- workspace: editor => output ---------- */

main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 7fr) auto minmax(0, 5fr);
    padding: 0 24px 10px;
    gap: 0;
}

.pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
}

.pane-head {
    display: flex;
    align-items: center;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
}

.pane-head .tools {
    margin-left: auto;
    display: flex;
    gap: 12px;
}

.pane-head button {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    background: none;
    border: none;
    padding: 0;
    color: var(--muted);
    cursor: pointer;
}

.pane-head button:hover, .pane-head button:focus-visible {
    color: var(--ink);
}

/* the rewrite arrow between the two panes */
.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 58px;
    color: var(--arrow);
    font-size: 22px;
    font-weight: 700;
    user-select: none;
}

.divider span { transition: opacity 0.2s; }

@keyframes arrow-pulse {
    0%, 100% { opacity: 1; transform: translateX(0); }
    50%      { opacity: 0.45; transform: translateX(4px); }
}

body.running .divider span {
    animation: arrow-pulse 0.9s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
    body.running .divider span { animation: none; opacity: 0.6; }
}

/* ---------- editor ---------- */

#editor-host { flex: 1; min-height: 0; }

.CodeMirror {
    height: 100%;
    background: var(--editor-bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.55;
}

.CodeMirror-gutters {
    background: var(--editor-bg);
    border-right: 1px solid var(--line);
}

.CodeMirror-linenumber { color: var(--faint); }

.CodeMirror-cursor { border-left: 2px solid var(--arrow); }

.CodeMirror-selected,
.CodeMirror-focused .CodeMirror-selected { background: #2c3648; }
.CodeMirror-line::selection,
.CodeMirror-line > span::selection,
.CodeMirror-line > span > span::selection { background: #2c3648; }

.CodeMirror-activeline-background { background: #1e2532; }

.CodeMirror-matchingbracket {
    color: var(--arrow) !important;
    outline: 1px solid var(--faint);
    background: transparent;
}

.CodeMirror pre.CodeMirror-placeholder { color: var(--faint); }

/* syntax colors — mirrors the LSP semantic token types */
.cm-keyword          { color: var(--arrow); font-weight: 700; }  /* def        */
.cm-subtext-defname  { color: var(--mint); font-weight: 700; }   /* name       */
.cm-bracket          { color: var(--muted); }                    /* braces     */
.cm-subtext-sep      { color: var(--muted); font-weight: 700; }  /* :: and ||  */
.cm-subtext-arrow    { color: var(--arrow); font-weight: 700; }  /* =>         */
.cm-subtext-call     { color: var(--sky); }                      /* foo(...)   */
.cm-subtext-register { color: var(--lilac); }                    /* #1, ^^#2   */
.cm-comment          { color: var(--faint); font-style: italic; }
.cm-subtext-ghost    { color: var(--faint); }                    /* ~          */
.cm-subtext-pattern  { color: var(--rose); }                     /* regex      */

/* ---------- output terminal ---------- */

#terminal {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 14px;
    margin: 0;
    background: var(--editor-bg);
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
}

#terminal:empty::before {
    content: "Output appears here. Press Run or Ctrl+Enter.";
    color: var(--faint);
}

#terminal .err { color: var(--err); }

/* ---------- status bar ---------- */

.statusbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 24px 14px;
    font-size: 12px;
    color: var(--muted);
}

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--faint);
    flex: none;
}

body.ready   .dot { background: var(--mint); }
body.running .dot { background: var(--arrow); }
body.failed  .dot { background: var(--err); }

.statusbar .right { margin-left: auto; color: var(--faint); }

/* ---------- narrow screens: stack panes, arrow points down ---------- */

@media (max-width: 860px) {
    main {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(220px, 3fr) auto minmax(160px, 2fr);
    }
    .divider { width: auto; height: 40px; }
    .divider span { transform: rotate(90deg); display: inline-block; }
    body.running .divider span { animation: none; opacity: 0.6; }
    header { flex-wrap: wrap; row-gap: 4px; }
}
</style>
</head>
<body>

<header>
    <h1>Subtext</h1>
    <span class="tagline">an esoteric string-rewriting language</span>
    <nav>
        <a href="https://github.com/rlauff/subtext#documentation">language reference</a>
        <a href="https://github.com/rlauff/subtext">github</a>
    </nav>
</header>

<div class="toolbar">
    <span class="label">examples</span>
    <span id="examples"></span>
    <span class="spacer"></span>
    <button class="action" id="stop-btn" disabled>Stop</button>
    <button class="action" id="run-btn" disabled>Run<kbd>Ctrl+&#9166;</kbd></button>
</div>

<main>
    <section class="pane" aria-label="Program editor">
        <div class="pane-head">
            program
            <span class="tools">
                <button id="share-btn" title="Copy a link to this program">copy link</button>
            </span>
        </div>
        <div id="editor-host"></div>
    </section>

    <div class="divider" aria-hidden="true"><span>=&gt;</span></div>

    <section class="pane" aria-label="Program output">
        <div class="pane-head">
            output
            <span class="tools">
                <button id="clear-btn">clear</button>
            </span>
        </div>
        <pre id="terminal"></pre>
    </section>
</main>

<div class="statusbar">
    <span class="dot"></span>
    <span id="status">loading wasm module&hellip;</span>
    <span class="right" id="cursor-pos"></span>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ */
/*  editor                                                            */
/* ------------------------------------------------------------------ */

const DEFAULT_PROGRAM = `// Welcome to Subtext. A program is rewritten, step by step,
// until nothing changes any more.
//
// The scope below has the form { input :: pattern => output }.
// Its input is matched against the regex pattern, the capture
// groups are stored in registers #1, #2, ..., and the whole
// scope is replaced by the output.

print_output({ world, hello :: (.*), (.*) => #2, #1! })

// Load an example above, or see the language reference.
`;

const editor = CodeMirror(document.getElementById("editor-host"), {
    mode: "subtext",
    value: DEFAULT_PROGRAM,
    lineNumbers: true,
    matchBrackets: true,
    styleActiveLine: true,
    indentUnit: 4,
    tabSize: 4,
    lineWrapping: true,
    placeholder: "Write your Subtext program here\u2026",
});

const statusEl  = document.getElementById("status");
const terminal  = document.getElementById("terminal");
const runBtn    = document.getElementById("run-btn");
const stopBtn   = document.getElementById("stop-btn");
const cursorPos = document.getElementById("cursor-pos");

editor.on("cursorActivity", () => {
    const c = editor.getCursor();
    cursorPos.textContent = (c.line + 1) + ":" + (c.ch + 1);
});

/* restore code: URL fragment first, then last session */
(function restoreCode() {
    const m = location.hash.match(/^#code=(.+)$/);
    if (m) {
        try {
            editor.setValue(decodeURIComponent(escape(atob(m[1]))));
            return;
        } catch (e) { /* malformed link, fall through */ }
    }
    try {
        const saved = localStorage.getItem("subtext.code");
        if (saved) editor.setValue(saved);
    } catch (e) { /* storage unavailable, keep default */ }
})();

let saveTimer = null;
editor.on("change", () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        try { localStorage.setItem("subtext.code", editor.getValue()); }
        catch (e) { /* ignore */ }
    }, 400);
});

/* ------------------------------------------------------------------ */
/*  worker: runs the wasm interpreter off the main thread             */
/* ------------------------------------------------------------------ */

let worker = null;
let running = false;
let wasmReady = false;

function setStatus(cls, text) {
    document.body.classList.remove("ready", "running", "failed");
    if (cls) document.body.classList.add(cls);
    statusEl.textContent = text;
}

function spawnWorker() {
    wasmReady = false;
    worker = new Worker("worker.js", { type: "module" });
    worker.onmessage = onWorkerMessage;
    worker.onerror = (e) => {
        setStatus("failed", "worker failed to start" + (e.message ? ": " + e.message : ""));
    };
    worker.postMessage({ type: "init" });
}

/* prints are buffered and flushed once per frame so that a
   print-heavy program cannot stall the page */
let printBuffer = [];
let flushScheduled = false;

function flushPrints() {
    flushScheduled = false;
    if (!printBuffer.length) return;
    const stick = terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight < 8;
    for (const text of printBuffer) {
        if (/^Error\b/.test(text)) {
            const span = document.createElement("span");
            span.className = "err";
            span.textContent = text + "\n";
            terminal.appendChild(span);
        } else {
            terminal.appendChild(document.createTextNode(text + "\n"));
        }
    }
    printBuffer = [];
    if (stick) terminal.scrollTop = terminal.scrollHeight;
}

function schedulePrint(text) {
    printBuffer.push(text);
    if (!flushScheduled) {
        flushScheduled = true;
        requestAnimationFrame(flushPrints);
    }
}

function onWorkerMessage(e) {
    const msg = e.data;
    switch (msg.type) {
        case "ready":
            wasmReady = true;
            runBtn.disabled = false;
            if (!running) setStatus("ready", "ready");
            break;
        case "init-error":
            setStatus("failed", "could not load wasm module: " + msg.text);
            break;
        case "print":
            schedulePrint(msg.text);
            break;
        case "done":
            finishRun("ready", "finished in " + formatMs(msg.ms));
            break;
        case "error":
            schedulePrint("Error: " + msg.text);
            finishRun("failed", "run failed");
            break;
    }
}

function formatMs(ms) {
    return ms < 1000 ? Math.max(1, Math.round(ms)) + " ms"
                     : (ms / 1000).toFixed(2) + " s";
}

function finishRun(cls, text) {
    running = false;
    runBtn.disabled = !wasmReady;
    stopBtn.disabled = true;
    setStatus(cls, text);
    flushPrints();
}

function run() {
    if (running || !wasmReady) return;
    running = true;
    runBtn.disabled = true;
    stopBtn.disabled = false;
    terminal.textContent = "";
    printBuffer = [];
    setStatus("running", "running\u2026");
    worker.postMessage({ type: "run", code: editor.getValue() });
}

function stop() {
    if (!running) return;
    worker.terminate();
    finishRun("", "stopped \u2014 reloading wasm module\u2026");
    runBtn.disabled = true;
    spawnWorker();
}

runBtn.addEventListener("click", run);
stopBtn.addEventListener("click", stop);

editor.setOption("extraKeys", {
    "Ctrl-Enter": run,
    "Cmd-Enter": run,
    "Ctrl-/": "toggleComment",
    "Cmd-/": "toggleComment",
});

/* ------------------------------------------------------------------ */
/*  toolbar: examples, clear, share                                   */
/* ------------------------------------------------------------------ */

const EXAMPLES = ["binary_increment", "compare", "turing", "fibonacci", "memory_example"];

const examplesEl = document.getElementById("examples");
for (const name of EXAMPLES) {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = name;
    btn.addEventListener("click", async () => {
        try {
            const response = await fetch("examples/" + name + ".stx");
            if (!response.ok) throw new Error("HTTP " + response.status);
            editor.setValue(await response.text());
            terminal.textContent = "";
            history.replaceState(null, "", location.pathname);
            editor.focus();
        } catch (err) {
            schedulePrint("Error: could not load examples/" + name + ".stx (" + err.message + ")");
        }
    });
    examplesEl.appendChild(btn);
}

document.getElementById("clear-btn").addEventListener("click", () => {
    terminal.textContent = "";
});

document.getElementById("share-btn").addEventListener("click", async (e) => {
    const code = btoa(unescape(encodeURIComponent(editor.getValue())));
    const url = location.origin + location.pathname + "#code=" + code;
    history.replaceState(null, "", "#code=" + code);
    const btn = e.currentTarget;
    try {
        await navigator.clipboard.writeText(url);
        btn.textContent = "copied";
    } catch (err) {
        btn.textContent = "link in address bar";
    }
    setTimeout(() => { btn.textContent = "copy link"; }, 1600);
});

/* ------------------------------------------------------------------ */

spawnWorker();
</script>
</body>
</html>
