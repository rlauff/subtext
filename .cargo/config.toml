# TODO(review): new file. Raises the wasm stack from the 1 MB default to 8 MB so that the
# interpreter's native recursion (~3-5 KB of stack per nesting depth) can actually reach
# RECURSION_LIMIT (=1000) before the wasm stack runs out. Requires rebuilding pkg/ with
# wasm-pack. Without this, the 1 MB stack overflows around depth ~300, and the fibonacci
# example already needs depth 225.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-args=-zstack-size=8388608"]
